<nav th:fragment="navbar"
    class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow-sm border-bottom border-secondary"
    style="min-height: 80px">
    <!-- Mobile toggle -->
    <button id="sidebarMobileToggle" class="navbar-toggler d-md-none border-0" type="button"
        aria-label="Toggle navigation" style="order: -1; margin-left: 0.5rem">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Brand/Logo -->
    <a class="navbar-brand col-auto me-0 px-3 fs-5 fw-bold text-white" href="/admin/home">
        <i class="bi bi-shield-lock me-2 text-danger"></i>
        <span class="d-none d-sm-inline">GastuApp Admin</span>
    </a>

    <!-- Admin Navigation Links -->
    <ul class="navbar-nav flex-row gap-3 ms-3 d-none d-md-flex">
        <li class="nav-item">
            <a class="nav-link text-white" href="/admin/users">
                <i class="bi bi-people me-1"></i>Gestión de Usuarios
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="/admin/ajustes-conceptos">
                <i class="bi bi-gear me-1"></i>Ajustes Conceptos
            </a>
        </li>
    </ul>

    <!-- Spacer -->
    <div class="flex-grow-1"></div>

    <!-- Right side icons -->
    <div class="navbar-nav flex-row align-items-center">

        <!-- Profile Icon -->
        <div class="nav-item me-2 position-relative">
            <a class="nav-link px-3 d-flex align-items-center" href="#" id="profileBtn">
                <i class="bi bi-person-circle fs-5"></i>
                <span class="ms-2 d-none d-sm-inline" th:text="${#authentication.name}">Admin</span>
            </a>
        </div>
    </div>

    <!-- Profile Modal (Custom Panel) -->
    <div id="profileModal" class="custom-modal" style="display: none">
        <div class="custom-modal-content profile-panel shadow-lg">
            <div class="p-2 bg-light border-bottom">
                <h6 class="mb-0 px-2 py-1 small text-muted fw-bold">Administrador</h6>
            </div>
            <div class="p-1">
                <a class="nav-link d-flex align-items-center gap-2" th:href="@{/admin/ajustes-conceptos}"
                    th:classappend="${currentPath == '/admin/ajustes-conceptos' ? 'active' : ''}">
                    <i class="bi bi-gear"></i>
                    Ajustes Conceptos
                </a>
                <hr class="my-1" />
                <form action="/logout" method="post" class="d-inline w-100">
                    <button type="submit" class="dropdown-item text-danger rounded py-2 w-100 text-start">
                        <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <style>
        .navbar-brand:hover {
            opacity: 0.9;
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25);
        }

        .navbar .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 0.25rem;
        }

        /* Custom Modal Styling */
        .custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            pointer-events: none;
        }

        .custom-modal-content {
            position: absolute;
            background: white;
            border-radius: 12px;
            pointer-events: auto;
        }

        /* Profile Panel */
        .profile-panel {
            top: 80px;
            right: 10px;
            width: 220px;
        }

        .dropdown-item {
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: #212529;
            display: block;
            transition: background-color 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: #f8f9fa;
            color: #212529;
        }
    </style>

    <script>
        // Simple script to handle profile modal toggle for Admin
        document.addEventListener('DOMContentLoaded', function () {
            const profileBtn = document.getElementById('profileBtn');
            const profileModal = document.getElementById('profileModal');

            if (profileBtn && profileModal) {
                profileBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (profileModal.style.display === 'none') {
                        profileModal.style.display = 'block';
                    } else {
                        profileModal.style.display = 'none';
                    }
                });

                // Close when clicking outside
                document.addEventListener('click', function (e) {
                    if (profileModal.style.display === 'block' && !profileModal.contains(e.target) && !profileBtn.contains(e.target)) {
                        profileModal.style.display = 'none';
                    }
                });
            }
        });
    </script>
</nav>
