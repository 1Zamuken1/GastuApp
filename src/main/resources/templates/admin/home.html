<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragments/head :: head(title='Admin - Panel de Control', links=~{})}"></head>
  <body th:attr="data-user-role=${#authentication != null && #authentication.principal != null && !#lists.isEmpty(#authentication.principal.authorities) ? #authentication.principal.authorities[0].authority : ''}"> 
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-4">
      <div class="card">
        <div class="card-body">
          <h1 class="h3">Panel de Administrador</h1>
        

          <div class="mt-4">
            <a href="/admin/users" class="btn btn-primary">Gestionar usuarios</a>
            <a href="/admin/settings" class="btn btn-outline-dark">Ajustes Conceptos</a>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/head :: scripts}"></div>
  </body>
</html>
