<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head(title='Admin - Usuarios', links=~{})}"></head>

<body
  th:attr="data-user-role=${#authentication != null && #authentication.principal != null && !#lists.isEmpty(#authentication.principal.authorities) ? #authentication.principal.authorities[0].authority : ''}">
  <div th:replace="~{fragments/navbar_admin :: navbar}"></div>

  <main class="container py-4">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h3 mb-0">Gestión de Usuarios</h1>
          <button id="newUserBtn" class="btn btn-success">Nuevo usuario</button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped" id="usersTable">
            <thead>
              <tr>
                <th style="display:none">ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Rol</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- filas renderizadas por JS -->
            </tbody>
          </table>
        </div>

        <!-- Modales -->
        <div class="modal fade" id="editModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Editar Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="editForm">
                  <input type="hidden" id="editId" />
                  <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input class="form-control" id="editUsername" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input class="form-control" id="editEmail" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input class="form-control" id="editTelefono" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Contraseña (dejar vacío para no cambiar)</label>
                    <input type="password" class="form-control" id="editPassword" />
                  </div>
                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="editActivo">
                    <label class="form-check-label" for="editActivo">Activo</label>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select class="form-select" id="editRol"></select>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="saveEditBtn" class="btn btn-primary">Guardar</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Create User Modal -->
  <div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crear Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="createForm">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input class="form-control" id="createUsername" />
            </div>
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input class="form-control" id="createEmail" />
            </div>
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input class="form-control" id="createTelefono" />
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="createPassword" />
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="createActivo" checked>
              <label class="form-check-label" for="createActivo">Activo</label>
            </div>
            <div class="mb-3">
              <label class="form-label">Rol</label>
              <select class="form-select" id="createRol"></select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="saveCreateBtn" class="btn btn-success">Crear</button>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/head :: scripts}"></div>
  <script src="/js/admin/users.js"></script>
</body>

</html>
