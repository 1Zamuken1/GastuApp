<div th:fragment="modalCrear">
    <div class="modal fade" id="modalCrear" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header" style="background-color: #6f42c1; color: white;">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle me-2"></i>
                        Crear Programación
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="formCrearProgramacion">
                        <input type="hidden" id="conceptoIdCrear" name="conceptoId">
                        <input type="hidden" id="tipoCrear" name="tipo">

                        <!-- Concepto -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-tag me-1"></i>
                                Concepto <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="text"
                                       class="form-control"
                                       id="conceptoNombreCrear"
                                       placeholder="Selecciona un concepto..."
                                       readonly
                                       required>
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        id="btnSeleccionarConceptoCrear">
                                    <i class="bi bi-search me-1"></i>
                                    Seleccionar
                                </button>
                            </div>
                        </div>

                        <!-- Monto -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-currency-dollar me-1"></i>
                                Monto <span class="text-danger">*</span>
                            </label>
                            <input type="number"
                                   class="form-control"
                                   id="crearMonto"
                                   name="montoProgramado"
                                   placeholder="0.00"
                                   step="0.01"
                                   min="0"
                                   required>
                        </div>

                        <!-- Frecuencia -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-arrow-repeat me-1"></i>
                                Frecuencia <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="crearFrecuencia" name="frecuencia" required>
                                <option value="">Selecciona una frecuencia...</option>
                                <option value="DIARIA">Diaria</option>
                                <option value="SEMANAL">Semanal</option>
                                <option value="QUINCENAL">Quincenal</option>
                                <option value="MENSUAL">Mensual</option>
                                <option value="BIMENSUAL">Bimensual</option>
                                <option value="TRIMESTRAL">Trimestral</option>
                                <option value="SEMESTRAL">Semestral</option>
                                <option value="ANUAL">Anual</option>
                            </select>
                        </div>

                        <!-- Fecha de Inicio -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-calendar-event me-1"></i>
                                Fecha de Inicio <span class="text-danger">*</span>
                            </label>
                            <input type="date"
                                   class="form-control"
                                   id="crearFechaInicio"
                                   name="fechaInicio"
                                   required>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-card-text me-1"></i>
                                Descripción
                            </label>
                            <textarea class="form-control"
                                      id="crearDescripcion"
                                      name="descripcion"
                                      rows="3"
                                      placeholder="Describe esta programación (opcional)..."></textarea>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>
                        Cancelar
                    </button>
                    <button type="button" class="btn btn-purple" id="btnGuardarCrear">
                        <i class="bi bi-check-lg me-1"></i>
                        Guardar
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
    .btn-purple {
        background-color: #6f42c1;
        border-color: #6f42c1;
        color: white;
    }
    .btn-purple:hover {
        background-color: #5a34a3;
        border-color: #5a34a3;
        color: white;
    }
</style>
