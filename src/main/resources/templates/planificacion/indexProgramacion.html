<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Programaciones - GastuApp', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/planificacion/programacion.css}">
</head>
<body>
     <!-- ESTILOS INLINE -->
    <style>
        .text-purple { color: #6f42c1; }
        .btn-purple { background:#6f42c1; color:white; border-color:#6f42c1; }
        .btn-purple:hover { background:#5a34a3; color:white; border-color:#5a34a3; }
        .bg-purple-light { background:#e8dcf7; }
        .bg-success-light { background:#d4edda; }
        .bg-danger-light { background:#f8d7da; }
        .bg-info-light { background:#d1ecf1; }

        .stat-icon {
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }
        .stat-card { transition: transform .2s; }
        .stat-card:hover { transform: translateY(-3px); }

        .empty-state { padding:60px 20px; text-align:center; }
        .empty-state i { font-size:4rem; opacity:.3; }
    </style>
    <!-- NAVBAR -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <!-- SIDEBAR -->
    <nav th:replace="~{fragments/sidebar :: sidebar(activePage='Programaciones')}"
         class="d-md-block bg-light sidebar collapse"></nav>

    <!-- MAIN -->
    <main class="px-md-4 py-4">
        <div class="container">
            
            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="text-dark mb-1">
                        <i class="bi bi-calendar-check text-purple me-2"></i>
                        Mis Programaciones
                    </h1>
                    <p class="text-muted mb-0">Gestiona tus ingresos y egresos programados</p>
                </div>
                <button id="btnVerPendientes" class="btn btn-warning">
                    <i class="bi bi-exclamation-triangle me-1"></i>
                    Ver Pendientes
                    <span id="badgePendientes" class="badge bg-danger ms-1">0</span>
                </button>
            </div>

            <!-- BUSCADOR / FILTROS -->
            <div class="panel-box mb-4">
                <div class="section-header">
                    <div class="d-flex align-items-center gap-2 flex-wrap w-100">

                        <!-- Buscador -->
                        <div class="input-group search-bar">
                            <input type="text" id="buscadorProgramacion" class="form-control"
                                   placeholder="Buscar por descripción, concepto o monto...">
                            <button id="btnLimpiarBuscador" class="btn btn-outline-secondary" type="button">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <!-- Filtro Tipo -->
                        <select id="filtroTipo" class="form-select" style="min-width: 150px;">
                            <option value="">Todos los tipos</option>
                            <option value="INGRESO">Ingresos</option>
                            <option value="EGRESO">Egresos</option>
                        </select>

                        <!-- Filtro Estado -->
                        <select id="filtroEstado" class="form-select" style="min-width: 150px;">
                            <option value="">Todos los estados</option>
                            <option value="true">Activos</option>
                            <option value="false">Inactivos</option>
                        </select>

                        <!-- Botón nuevo -->
                        <button id="btnNuevo" class="btn btn-purple">
                            <i class="bi bi-plus-lg me-1"></i>
                            Nueva Programación
                        </button>
                    </div>
                </div>
            </div>

            <!-- ESTADÍSTICAS -->
            <div class="row g-3 mb-4" id="estadisticas">

                <div class="col-lg-3 col-md-6">
                    <div class="card border-0 shadow-sm stat-card">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="stat-icon bg-purple-light">
                                    <i class="bi bi-list-check text-purple"></i>
                                </div>
                                <div class="ms-3">
                                    <h6 class="text-muted mb-1">Total</h6>
                                    <h3 id="totalProgramaciones">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="card border-0 shadow-sm stat-card">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="stat-icon bg-success-light">
                                    <i class="bi bi-arrow-up-circle text-success"></i>
                                </div>
                                <div class="ms-3">
                                    <h6 class="text-muted mb-1">Ingresos</h6>
                                    <h3 id="totalIngresos" class="text-success">$0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="card border-0 shadow-sm stat-card">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="stat-icon bg-danger-light">
                                    <i class="bi bi-arrow-down-circle text-danger"></i>
                                </div>
                                <div class="ms-3">
                                    <h6 class="text-muted mb-1">Egresos</h6>
                                    <h3 id="totalEgresos" class="text-danger">$0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="card border-0 shadow-sm stat-card">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="stat-icon bg-info-light">
                                    <i class="bi bi-check-circle text-info"></i>
                                </div>
                                <div class="ms-3">
                                    <h6 class="text-muted mb-1">Activas</h6>
                                    <h3 id="totalActivas" class="text-info">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- LISTA -->
            <div class="panel-box">
                <div class="scroll-area">
                    <div id="contenedorProgramaciones" class="row g-3">
                        <!-- JS carga aquí -->
                    </div>

                    <div id="estadoVacio" class="empty-state d-none">
                        <i class="bi bi-calendar-x text-purple"></i>
                        <h4 class="mt-3">No hay programaciones</h4>
                        <p class="text-muted">Crea tu primera programación para automatizar tus movimientos.</p>
                        <button class="btn btn-purple mt-2" onclick="document.getElementById('btnNuevo').click()">
                            <i class="bi bi-plus-circle me-1"></i>
                            Crear Programación
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- MODALES -->
    <div th:replace="~{planificacion/programacion/crearProgramacion :: modalCrear}"></div>
    <div th:replace="~{planificacion/programacion/editarProgramacion :: modalEditar}"></div>
    <div th:replace="~{planificacion/modales/modalSeleccionarConcepto :: modalConcepto}"></div>

    <!-- SCRIPTS -->
 

   <!-- AL FINAL DEL BODY, ANTES DE CERRAR </body> -->

<!-- 1. PRIMERO: jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- 2. DESPUÉS: Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 3. DESPUÉS: SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- 4. AL FINAL: Tu script personalizado -->
    <div th:replace="~{fragments/head :: scripts}"></div>
<script th:src="@{/js/planificacion/programaciones.js}"></script>

</body>
</html>
