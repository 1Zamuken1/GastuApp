<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/head :: head('Dashboard - GastuApp', ~{::link})">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" th:href="@{/css/dashboard/dashboard.css}" />
    <!-- Driver.js Tour Styles -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"
    />
  </head>
  <body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid">
      <div class="row">
        <div
          th:replace="fragments/sidebar :: sidebar(activePage='dashboard')"
        ></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <!-- Header with Navigation -->
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
          >
            <h1 class="h2">Dashboard</h1>

            <div class="btn-toolbar mb-2 mb-md-0 month-nav">
              <div class="btn-group shadow-sm" role="group">
                <a
                  th:href="@{/dashboard(mes=${dashboard.mesNumero == 1 ? 12 : dashboard.mesNumero - 1}, anio=${dashboard.mesNumero == 1 ? dashboard.anioActual - 1 : dashboard.anioActual})}"
                  class="btn btn-outline-primary d-flex align-items-center gap-1"
                  style="border-radius: 8px 0 0 8px"
                >
                  <i class="bi bi-chevron-left"></i> Anterior
                </a>
                <div
                  class="btn btn-primary text-white fw-bold d-flex align-items-center gap-2"
                  style="cursor: default; border-radius: 0"
                >
                  <i class="bi bi-calendar3"></i>
                  <span
                    th:text="${dashboard.mesActual + ' ' + dashboard.anioActual}"
                    >Mes Actual</span
                  >
                </div>
                <a
                  th:href="@{/dashboard(mes=${dashboard.mesNumero == 12 ? 1 : dashboard.mesNumero + 1}, anio=${dashboard.mesNumero == 12 ? dashboard.anioActual + 1 : dashboard.anioActual})}"
                  class="btn btn-outline-primary d-flex align-items-center gap-1"
                  style="border-radius: 0 8px 8px 0"
                >
                  Siguiente <i class="bi bi-chevron-right"></i>
                </a>
              </div>
            </div>
          </div>

          <!-- Row 1: Summary Cards -->
          <div class="row mb-4">
            <div class="col-md-4 mb-3 mb-md-0">
              <div
                th:class="${dashboard.balance >= 0 ? 'card bg-success text-white h-100 shadow-sm dashboard-balance-card' : 'card bg-danger text-white h-100 shadow-sm dashboard-balance-card'}"
              >
                <div
                  class="card-body d-flex flex-column justify-content-center align-items-center text-center"
                >
                  <h6 class="card-subtitle mb-2 text-white-50">
                    Balance del Mes
                  </h6>
                  <h2
                    class="display-4 fw-bold mb-0"
                    th:text="${'$' + #numbers.formatDecimal(dashboard.balance, 1, 'POINT', 2, 'COMMA')}"
                  >
                    $0.00
                  </h2>
                </div>
              </div>
            </div>

            <div class="col-md-8">
              <div
                class="card h-100 shadow-sm border-0 border-top border-4 border-primary dashboard-stats-card"
              >
                <div class="card-body">
                  <div class="row text-center h-100 align-items-center">
                    <div class="col-4 border-end">
                      <h6 class="text-muted small mb-2">
                        <i class="bi bi-arrow-up-circle me-1 text-success"></i
                        >Ingresos
                      </h6>
                      <h3
                        class="fw-bold mb-0 text-success"
                        th:text="${'$' + #numbers.formatDecimal(dashboard.totalIngresos, 1, 'POINT', 2, 'COMMA')}"
                      >
                        $0.00
                      </h3>
                    </div>
                    <div class="col-4 border-end">
                      <h6 class="text-muted small mb-2">
                        <i class="bi bi-arrow-down-circle me-1 text-danger"></i
                        >Egresos
                      </h6>
                      <h3
                        class="fw-bold mb-0 text-danger"
                        th:text="${'$' + #numbers.formatDecimal(dashboard.totalEgresos, 1, 'POINT', 2, 'COMMA')}"
                      >
                        $0.00
                      </h3>
                    </div>
                    <div class="col-4">
                      <h6 class="text-muted small mb-2">
                        <i class="bi bi-piggy-bank me-1 text-warning"></i
                        >Ahorros
                      </h6>
                      <h3
                        class="fw-bold mb-0 text-warning"
                        th:text="${'$' + #numbers.formatDecimal(dashboard.totalAhorros, 1, 'POINT', 2, 'COMMA')}"
                      >
                        $0.00
                      </h3>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Row 2: Trend Chart + Expense Distribution -->
          <div class="row mb-4">
            <div class="col-md-7 mb-3 mb-md-0">
              <div
                class="card h-100 shadow-sm border-0 border-top border-4 border-primary chart-card"
              >
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0 fw-bold">
                    <i class="bi bi-graph-up text-primary me-2"></i>Tendencia
                    del Mes
                  </h5>
                </div>
                <div class="card-body">
                  <div id="mainTrendChart" style="height: 320px"></div>
                </div>
              </div>
            </div>

            <div class="col-md-5">
              <div
                class="card h-100 shadow-sm border-0 border-top border-4 border-danger chart-card"
              >
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0 fw-bold">
                    <i class="bi bi-pie-chart text-danger me-2"></i>Gastos por
                    Categoría
                  </h5>
                </div>
                <div class="card-body">
                  <div id="expenseDonutChart" style="height: 320px"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Row 3: Balance Chart + Savings Chart -->
          <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
              <div
                class="card h-100 shadow-sm border-0 border-top border-4 border-success chart-card"
              >
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0 fw-bold">
                    <i class="bi bi-bar-chart text-success me-2"></i>Balance
                    Disponible
                    <small
                      class="text-muted fw-normal ms-2"
                      style="font-size: 0.7em"
                      >(Ingresos - Egresos - Ahorros)</small
                    >
                  </h5>
                </div>
                <div class="card-body">
                  <div id="balanceTrendChart" style="height: 280px"></div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div
                class="card h-100 shadow-sm border-0 border-top border-4 border-warning chart-card"
              >
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0 fw-bold">
                    <i class="bi bi-piggy-bank text-warning me-2"></i>Metas de
                    Ahorro
                  </h5>
                </div>
                <div class="card-body">
                  <div id="savingsChart" style="height: 280px"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Row 4: Presupuestos + Proyecciones -->
          <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
              <div
                class="card h-100 shadow-sm border-0 border-top border-4 chart-card"
                style="border-color: #6f42c1 !important"
              >
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0 fw-bold">
                    <i class="bi bi-wallet2" style="color: #6f42c1"></i>
                    <span class="ms-2">Presupuestos</span>
                  </h5>
                </div>
                <div class="card-body">
                  <div id="budgetChart" style="height: 220px"></div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div
                id="projectionsCard"
                class="card h-100 shadow-sm border-0 border-top border-4 placeholder-card"
                style="border-color: #20c997 !important"
              >
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0 fw-bold">
                    <i class="bi bi-graph-up-arrow" style="color: #20c997"></i>
                    <span class="ms-2">Proyecciones</span>
                    <span class="badge bg-secondary ms-2">Próximamente</span>
                  </h5>
                </div>
                <div
                  class="card-body d-flex flex-column align-items-center justify-content-center"
                  style="height: 220px"
                >
                  <i
                    class="bi bi-graph-up-arrow display-1 text-muted opacity-25"
                  ></i>
                  <p class="text-muted mt-3 mb-0">Proyecciones financieras</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Floating Help Button for Tour -->
          <button
            id="tour-help-btn"
            class="tour-help-btn"
            title="Iniciar tour de ayuda"
          >
            <i class="bi bi-question-lg"></i>
          </button>
        </main>
      </div>
    </div>

    <div th:replace="~{fragments/head :: scripts}"></div>

    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- Driver.js Tour Library -->
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>

    <!-- Dashboard Charts -->
    <script th:src="@{/js/dashboard/dashboard.js}"></script>

    <!-- Dashboard Tour -->
    <script th:src="@{/js/dashboard/dashboard-tour.js}"></script>

    <script th:inline="javascript">
      /*<![CDATA[*/
      document.addEventListener("DOMContentLoaded", function () {
        // Prepare data from Thymeleaf
        const dashboardData = {
          labels: /*[[${dashboard.chartLabels}]]*/ [],
          dataIngresos: /*[[${dashboard.chartIngresos}]]*/ [],
          dataEgresos: /*[[${dashboard.chartEgresos}]]*/ [],
          dataAhorros: /*[[${dashboard.chartAhorros}]]*/ [],
          dataBalance: /*[[${dashboard.chartBalance}]]*/ [],
          expenseNames: /*[[${dashboard.expenseConceptNames}]]*/ [],
          expenseAmounts: /*[[${dashboard.expenseConceptAmounts}]]*/ [],
          ingresosBreakdown: /*[[${dashboard.ingresosConceptBreakdown}]]*/ [],
          egresosBreakdown: /*[[${dashboard.egresosConceptBreakdown}]]*/ [],
          ahorrosBreakdown: /*[[${dashboard.ahorrosConceptBreakdown}]]*/ [],
          savingsGoalNames: /*[[${dashboard.savingsGoalNames}]]*/ [],
          savingsGoalTargets: /*[[${dashboard.savingsGoalTargets}]]*/ [],
          savingsGoalAccumulated:
            /*[[${dashboard.savingsGoalAccumulated}]]*/ [],
          budgetNames: /*[[${dashboard.budgetNames}]]*/ [],
          budgetLimits: /*[[${dashboard.budgetLimits}]]*/ [],
          budgetSpent: /*[[${dashboard.budgetSpent}]]*/ [],
        };

        // Initialize all charts
        initDashboardCharts(dashboardData);
      });
      /*]]>*/
    </script>
  </body>
</html>
